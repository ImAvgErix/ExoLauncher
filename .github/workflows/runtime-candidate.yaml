name: Runtime candidate

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: Exact reviewed stable .NET 11 SDK version
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.sdk }}
      - run: ./tools/Test-RuntimeCandidate.ps1 -CandidateSdkVersion $env:EXO_CANDIDATE_SDK -PackageDirectory ./artifacts/runtime-candidate/package -BuildAndPublish
        env:
          EXO_CANDIDATE_SDK: ${{ inputs.sdk }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-candidate-evidence
          path: |
            artifacts/runtime-candidate/*.log
            artifacts/runtime-candidate/runtime-candidate.json
