name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            mouse/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm ci
        working-directory: mouse
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build ExoLauncher.sln -c Debug -p:Platform=x64
      - run: ./tools/Test-DependencySecurity.ps1
      # Keep Release resource indexing in the same Windows App SDK mode as the package.
      - run: dotnet build ExoLauncher.sln -c Release -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=false
      # Self-contained, so the test host needs no Windows App Runtime installed on the runner.
      - run: dotnet test --project ExoLauncher.Tests/ExoLauncher.Tests.csproj -c Release -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=false --no-build
      # The installer's payload check and the update rollback, on fake bytes: nothing is installed or started.
      - run: ./tools/Test-InstallerPayload.ps1
      - run: ./tools/Test-UpdateRollback.ps1
      - run: dotnet publish ExoLauncher/ExoLauncher.csproj -c Release -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=false -o artifacts/package

  ui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            mouse/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mouse
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run check
        working-directory: mouse
      - run: npm run dead
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          include-hidden-files: true
          name: ui-bundle-report
          path: ExoLauncher/wwwroot/.vite/manifest.json

  secrets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./tools/Test-SecretHistory.ps1
