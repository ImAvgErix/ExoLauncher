name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: .github/.markdownlint-cli2.yaml
          globs: |
            README.md
            CHANGELOG.md
            PRIVACY.md
            THIRD_PARTY_NOTICES.md
            SECURITY.md
            CONTRIBUTING.md
            TRADEMARKS.md
            docs/HELP.md
            docs/SUPPORT_MATRIX.md
            docs/VENDORS.md
            docs/RELEASE_*.md
            .github/**/*.md

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .github/lychee.toml --no-progress './README.md' './CHANGELOG.md' './PRIVACY.md' './THIRD_PARTY_NOTICES.md' './SECURITY.md' './CONTRIBUTING.md' './TRADEMARKS.md' './docs/HELP.md' './docs/SUPPORT_MATRIX.md' './docs/VENDORS.md' './docs/RELEASE_*.md' './.github/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: README, CHANGELOG and release notes agree
        shell: pwsh
        run: ./.github/scripts/Test-DocsVersion.ps1 -Version (Get-Content VERSION -Raw).Trim() -AllowUnreleased
