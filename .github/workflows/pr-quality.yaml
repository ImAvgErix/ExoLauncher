name: PR Quality

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  anti-slop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      # v0.3.0 — pinned by SHA so a retagged mutable ref cannot run new code
      # against the pull-requests:write token.
      - uses: peakoss/anti-slop@57858eead489d08b255fab2af45a506c2ca6eab2
        with:
          max-failures: 4
