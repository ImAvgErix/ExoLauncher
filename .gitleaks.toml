[extend]
useDefault = true

[[allowlists]]
description = "Exact synthetic hex strings used by isolated Steam key/parser tests; no path exclusions"
regexTarget = "secret"
regexes = ['''^0123456789abcdef0123456789abcdef\r?$''', '''^0123456789abcdef0123\r?$''']
[[allowlists]]
description = "Four exact public blocking-pattern strings in the checksum-verified uBlock Origin 1.74.0 Chromium archive; not Exo credentials"
regexTarget = "secret"
regexes = ['''^6922a2c8-d1e9-43be-b201-749543d28fe1$''', '''^d35e161b-abb4-4949-b523-003165d250bb$''', '''^934912b3e760e068a91cd6cb502096a55ab1ca16$''', '''^934912b3e760e068a91cd6cb502096a55ab1ca16$''']
[[allowlists]]
description = "YouTube's public InnerTube web key, embedded in youtube.com itself and shipped by upstream SponsorBlock 6.1.7 for youtubei/v1/player calls; not an Exo credential"
targetRules = ["gcp-api-key", "generic-api-key"]
condition = "AND"
paths = ['''(^|/)Assets/Extensions/sponsorblock/js/(content|options|popup)\.js$''']
regexTarget = "secret"
regexes = ['''^AIzaSyA8eiZmM1FaDVjRy-df2KTyQ_vz_yYM39w$''']
[[allowlists]]
description = "Chrome extension manifest \"key\" (RSA public key that fixes the extension ID) shipped by upstream Better Lyrics 2.3.3; public by design"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)Assets/Extensions/better-lyrics/manifest\.json$''']
regexTarget = "secret"
regexes = ['''^MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA4RTGjLjI1KqxGLgE7d3tD4O\+mTA6pKDPZ29V4/uP9nBicHRst7R7n5wdFW1qvLiILyUqRm1fURMBeShb0mcPEMC6iW3cr4i8NG\+52VxFcPIYbsegPHJsQFVWe6lgorVw20yn2mWshGKIppgN14FJCSFc7mS/CX4JL88E82AIaFJiVBgmpBu5RMcglUfSwMH5ePlRV68dOhMjX8bdoHH6FoAARh7igtyKBKEzA811PWRIBiKZBGAZc2ew6\+5O2mERuFq0PRvfEcD4KsBRiWHltyUcYzVjIMF4soC8i6lNOJx8it0kAn5PN6G7TdiD3HbU5eLqk\+iCr\+cK/pS1ybiACQIDAQAB$''']
[[allowlists]]
description = "False positive: a style element id asserted in a since-deleted UI test, not a Discord client secret"
targetRules = ["discord-client-secret"]
condition = "AND"
paths = ['''^ui/tests/discordClientScripts\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^exo-discord-settings-tools-style$''']
[[allowlists]]
description = "jwt.io's public example token, used by the log redaction test to prove an unlabeled JWT is redacted; not a credential"
targetRules = ["jwt"]
condition = "AND"
paths = ['''^ExoLauncher\.Tests/AppLogRedactTests\.cs$''']
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c$''']
[[allowlists]]
description = "Synthetic 40-hex Steam Web API key the local red-team harness stores to prove it is encrypted at rest; not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^security/attacks/local/harness/Attack5_DataAtRest\.cs$''']
regexTarget = "secret"
regexes = ['''^0123456789ABCDEF0123456789ABCDEF01234567$''']

[[allowlists]]
description = "uBlock Origin Lite's own filter lists and scriptlets (public blocking patterns from its upstream release): host, cookie and parameter names the generic key rule takes for keys; not Exo credentials"
targetRules = ["generic-api-key"]
paths = ['''(^|/)Assets/Extensions/ublock-origin-lite/.*\.(json|js)$''']
