  <body>
    <!-- The glass filters a backdrop-filter names (src/styles/glass.css), in the page from the first frame, since one
         that names a missing filter draws nothing at all: exo-glass-soft blurs small glass under its lens
         (src/lib/glass.ts). Glass needs no other: its tone is CSS's own filter functions (src/tokens.css › --glassy-tone). -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <filter id="exo-glass-soft" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="6" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
