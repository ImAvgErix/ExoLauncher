    <style>html, body { margin: 0; background: #000; }</style>

  <body>
    <!-- Liquid Glass's material (src/styles/glass.css): in the page from the first frame, because a backdrop-filter
         that names a missing filter draws nothing at all. Small glass blurs what is behind it (exo-glass-soft, or its
         own lens from src/lib/glass.ts), then a tone saturates it and keeps it within a band of brightness: dark glass
         5% to 33% under white words, light glass 70% to 96% under dark words (small glass turns light over bright
         content); large glass blurs and tones in one, 3% to 24%, so over black it stays black (no flat gray) and over
         art it carries the art's color. Clear keeps as much of the art as the words allow: each band's bright end is
         the highest that keeps the secondary words at 4.5:1 on a hovered row. Tinted is a frosted pane: more blur, so
         art turns to a wash of its color, in a narrower band (small 10% to 22%, light 84% to 94%, large 7% to 14%).
         Alpha is set whole last, so near an edge, where the blur reaches past what the glass can see, the colors that
         were sampled fill in instead of the raw art behind. -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <filter id="exo-glass-soft" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="6" />
      </filter>
      <filter id="exo-glass-tone" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
        <feColorMatrix type="saturate" values="1.8" />
        <feComponentTransfer>
          <feFuncR type="linear" slope="0.28" intercept="0" />
          <feFuncG type="linear" slope="0.28" intercept="0" />
          <feFuncB type="linear" slope="0.28" intercept="0" />
          <feFuncA type="linear" slope="0" intercept="1" />
        </feComponentTransfer>
      </filter>
      <filter id="exo-glass-tone-light" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
        <feColorMatrix type="saturate" values="1.5" />
        <feComponentTransfer>
          <feFuncR type="linear" slope="0.26" intercept="0.7" />
          <feFuncG type="linear" slope="0.26" intercept="0.7" />
          <feFuncB type="linear" slope="0.26" intercept="0.7" />
          <feFuncA type="linear" slope="0" intercept="1" />
        </feComponentTransfer>
      </filter>
      <filter id="exo-glass-tone-tinted" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="10" />
        <feColorMatrix type="saturate" values="1.2" />
        <feComponentTransfer>
          <feFuncR type="linear" slope="0.12" intercept="0.1" />
          <feFuncG type="linear" slope="0.12" intercept="0.1" />
          <feFuncB type="linear" slope="0.12" intercept="0.1" />
          <feFuncA type="linear" slope="0" intercept="1" />
        </feComponentTransfer>
      </filter>
      <filter id="exo-glass-tone-light-tinted" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="10" />
        <feColorMatrix type="saturate" values="1.1" />
        <feComponentTransfer>
          <feFuncR type="linear" slope="0.1" intercept="0.84" />
          <feFuncG type="linear" slope="0.1" intercept="0.84" />
          <feFuncB type="linear" slope="0.1" intercept="0.84" />
          <feFuncA type="linear" slope="0" intercept="1" />
        </feComponentTransfer>
      </filter>
      <filter id="exo-glass-panel" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="18" />
        <feColorMatrix type="saturate" values="1.6" />
        <feComponentTransfer>
          <feFuncR type="linear" slope="0.21" intercept="0" />
          <feFuncG type="linear" slope="0.21" intercept="0" />
          <feFuncB type="linear" slope="0.21" intercept="0" />
          <feFuncA type="linear" slope="0" intercept="1" />
        </feComponentTransfer>
      </filter>
      <filter id="exo-glass-panel-tinted" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="40" />
        <feColorMatrix type="saturate" values="1.1" />
        <feComponentTransfer>
          <feFuncR type="linear" slope="0.07" intercept="0.07" />
          <feFuncG type="linear" slope="0.07" intercept="0.07" />
          <feFuncB type="linear" slope="0.07" intercept="0.07" />
          <feFuncA type="linear" slope="0" intercept="1" />
        </feComponentTransfer>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
