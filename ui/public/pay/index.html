<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The Discord Shop's card form, on its own origin (pay.exo-launcher.local): the only Exo page that loads Stripe.
         Card numbers stay in Stripe's own fields; this page hands Exo back only the id Stripe gives the saved card. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.stripe.com; font-src 'self'; connect-src https://api.stripe.com https://m.stripe.network; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Card</title>
    <style>
      html, body { margin: 0; background: transparent; color-scheme: dark; }
      body { font: 14px system-ui, sans-serif; overflow: hidden; }
      /* Exo's field (32px capsule); the frame keeps 2px around it for the focus ring. */
      #card { box-sizing: border-box; height: 32px; margin: 2px; padding: 8px 12px; border-radius: 999px; background: #121212; box-shadow: inset 0 1px 1px rgb(0 0 0 / 0.5), inset 0 -1px 0 rgb(255 255 255 / 0.04); }
      #card.is-focus { outline: 2px solid #f2ede4; outline-offset: 0; }
      body.is-wide #card { visibility: hidden; }
    </style>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="pay.js" defer></script>
  </head>
  <body>
    <div id="card"></div>
  </body>
</html>
