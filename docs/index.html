<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exo Launcher</title>
    <meta name="description" content="One home for Steam, Epic, GOG, Riot, and portable Windows games. Other clients stay out of the way." />
    <link rel="icon" type="image/png" href="media/logo.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #000;
        color: #f2f2f2;
        font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 20px 80px;
      }
      header { text-align: center; }
      header img.mark { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; margin: 18px 0 8px; }
      .lede { color: #8a8a8a; max-width: 36em; margin: 0 auto 28px; }
      .cta {
        display: inline-block;
        background: #f2f2f2;
        color: #000;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 999px;
      }
      .cta:hover { background: #fff; }
      .links { margin-top: 14px; font-size: 13px; }
      .links a { color: #8a8a8a; text-decoration: none; margin: 0 8px; }
      .links a:hover { color: #f2f2f2; }
      figure { margin: 36px 0 0; }
      figure img {
        width: 100%;
        border-radius: 16px;
        border: 1px solid #161616;
        display: block;
      }
      figcaption { color: #808080; font-size: 12px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="media/logo.png" alt="Exo" />
        <h1>Exo Launcher</h1>
        <p class="lede">One home. Install, update, and play Steam, Epic, GOG, Riot, and portable Windows games. The other clients stay out of the way.</p>
        <a class="cta" href="https://github.com/ImAvgErix/ExoLauncher/releases/latest/download/ExoLauncher-Setup.exe">Download for Windows 11</a>
        <p class="links">
          <a href="https://github.com/ImAvgErix/ExoLauncher">Source</a>
          <a href="https://github.com/ImAvgErix/ExoLauncher/releases/latest">Releases</a>
          <a href="https://github.com/ImAvgErix/ExoLauncher/blob/main/PRIVACY.md">Privacy</a>
        </p>
      </header>
      <figure>
        <img src="media/home.jpg" alt="Home — Now plate, pinned games, library" />
        <figcaption>Now, pinned, library. One Play button.</figcaption>
      </figure>
      <figure>
        <img src="media/game.jpg" alt="Game page with cover, facts, and Play" />
        <figcaption>Open a title. Progress and Play live here. Store chrome stays hidden.</figcaption>
      </figure>
      <figure>
        <img src="media/settings.jpg" alt="Settings — detected stores and achievement placement" />
        <figcaption>Stores that are on the PC. Achievement placement if you want it.</figcaption>
      </figure>
    </main>
  </body>
</html>
